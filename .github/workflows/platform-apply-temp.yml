# TEMPORARY. Delete this file once the clusters are back up and the group has
# agreed how the environment gets brought up and parked. It applies a root that
# belongs to B, so it should not outlive the reason it was added.

name: TEMP Platform Apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan shows the diff only. apply makes changes.'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      allow_destroy:
        description: 'Allow the plan to destroy existing resources. Leave false unless you have read the diff.'
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=infra/platform init -input=false

      - name: Terraform plan
        run: terraform -chdir=infra/platform plan -input=false -out=tfplan

      # Applying a root you did not write. A plan that only creates the two
      # clusters is expected. A plan that destroys the ACR, Redis or VNet means
      # the state has drifted further than the clusters and B should look first.
      - name: Summarise plan
        id: summary
        run: |
          terraform -chdir=infra/platform show -no-color tfplan > plan.txt
          echo "--- resource changes ---"
          grep -E '^  # ' plan.txt || echo "(no changes)"
          echo
          DESTROYS=$(grep -cE 'will be destroyed|must be replaced' plan.txt || true)
          echo "destroy_count=$DESTROYS" >> "$GITHUB_OUTPUT"
          echo "Planned destroys or replacements: $DESTROYS"

      - name: Block unexpected destroys
        if: steps.summary.outputs.destroy_count != '0' && inputs.allow_destroy != true
        run: |
          echo "The plan would destroy or replace ${{ steps.summary.outputs.destroy_count }} resource(s)." >&2
          echo "Read the plan output above. If this is genuinely intended, re-run with allow_destroy set." >&2
          exit 1

      - name: Terraform apply
        if: inputs.mode == 'apply'
        run: terraform -chdir=infra/platform apply -input=false tfplan

      - name: Show resulting clusters
        if: inputs.mode == 'apply'
        run: |
          az aks list \
            --query "[].{name:name, rg:resourceGroup, state:provisioningState}" \
            -o table
