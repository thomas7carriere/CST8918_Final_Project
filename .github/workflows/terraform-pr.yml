name: Terraform PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          for d in infra/network infra/platform infra/app; do
            if [ -d "$d" ]; then
              echo "== tflint $d =="
              tflint --chdir=$d --init
              tflint --chdir=$d
            fi
          done

  plan:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: plan
        run: |
          for d in infra/network infra/platform; do
            if [ -d "$d" ]; then
              echo "== plan $d =="
              terraform -chdir=$d init
              terraform -chdir=$d plan -input=false
            fi
          done